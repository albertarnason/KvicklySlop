name: Compile on all platforms

on:
  pull_request:
    branches:
      - main

jobs:
  windows:
    name: Compile Windows
    runs-on: windows-11-vs2026-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run build script
        shell: pwsh
        run: |
          ./build.bat

  linux:
    name: Compile Linux
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run build script
        run: |
          ./build.sh
